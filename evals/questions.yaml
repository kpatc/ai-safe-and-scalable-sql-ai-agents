  expected_min_rows: 0

- id: "q016"
  question: "Quel est le mois avec le plus de commandes passées ?"
  difficulty: hard
  category: orders
  answerable: true
  reference_sql: >
    SELECT strftime('%Y-%m', date_commande) AS mois,
           COUNT(*) AS nb_commandes
    FROM commandes
    GROUP BY mois
    ORDER BY nb_commandes DESC
    LIMIT 1
  expected_min_rows: 1

- id: "q017"
  question: "Combien de produits sont en rupture de stock ?"
  difficulty: easy
  category: products
  answerable: true
  reference_sql: >
    SELECT COUNT(*) AS ruptures FROM produits WHERE stock = 0
  expected_min_rows: 1

- id: "q018"
  question: "Quelle catégorie génère le plus de chiffre d'affaires ?"
  difficulty: hard
  category: cross
  answerable: true
  reference_sql: >
    SELECT cat.nom AS categorie,
           ROUND(SUM(lc.quantite * lc.prix_unitaire_paye * (1 - c.remise_pct / 100.0)), 2) AS ca
    FROM categories cat
    JOIN produits p ON p.categorie_id = cat.categorie_id
    JOIN lignes_commande lc ON lc.produit_id = p.produit_id
    JOIN commandes c ON lc.commande_id = c.commande_id
    WHERE c.statut IN ('livree', 'expediee')
    GROUP BY cat.categorie_id, cat.nom
    ORDER BY ca DESC
    LIMIT 1
  expected_columns: ["categorie", "ca"]
  expected_min_rows: 1

- id: "q019"
  question: "Quel est le taux de commandes annulées ?"
  difficulty: medium
  category: orders
  answerable: true
  reference_sql: >
    SELECT ROUND(
      100.0 * SUM(CASE WHEN statut = 'annulee' THEN 1 ELSE 0 END) / COUNT(*),
      2
    ) AS taux_annulation
    FROM commandes
  expected_min_rows: 1

- id: "q020"
  question: "Quels sont les avis laissés par les clients qui ont commandé plus de 5 fois ?"
  difficulty: hard
  category: cross
  answerable: true
  reference_sql: >
    SELECT cl.nom, cl.prenom, a.note, p.nom AS produit
    FROM avis a
    JOIN clients cl ON a.client_id = cl.client_id
    JOIN produits p ON a.produit_id = p.produit_id
    WHERE cl.client_id IN (
      SELECT client_id FROM commandes
      GROUP BY client_id
      HAVING COUNT(*) > 5
    )
    LIMIT 20
  expected_min_rows: 0

