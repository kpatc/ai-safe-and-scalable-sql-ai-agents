- id: "q025"
  question: "Combien de produits sont disponibles dans chaque catégorie ?"
  difficulty: easy
  category: cross
  answerable: true
  reference_sql: >
    SELECT c.nom AS categorie, COUNT(*) AS nb_produits
    FROM produits p
    JOIN categories c ON p.categorie_id = c.categorie_id
    WHERE p.actif = 1
    GROUP BY c.categorie_id, c.nom
    ORDER BY nb_produits DESC
