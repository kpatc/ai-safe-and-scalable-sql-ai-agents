- id: "q030"
  question: "Quels produits ont reçu à la fois une note de 5 et une note de 1 ?"
  difficulty: hard
  category: reviews
  answerable: true
  reference_sql: >
    SELECT DISTINCT p.nom
    FROM produits p
    JOIN avis a1 ON a1.produit_id = p.produit_id AND a1.note = 5
    JOIN avis a2 ON a2.produit_id = p.produit_id AND a2.note = 1
  expected_min_rows: 0
